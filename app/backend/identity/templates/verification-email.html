<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{subject}}</title>
</head>
<body style="margin:0;background-color:#edf6ff;color:#17283d;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preview_text}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#edf6ff;">
    <tr>
      <td align="center" style="padding:26px 14px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:440px;background-color:#ffffff;border:1px solid #d7e7f8;border-radius:24px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:25px 20px 22px;background-color:#dceeff;background-image:linear-gradient(150deg,#d6eaff,#edf7ff);">
              <p style="margin:0 0 13px;font-size:13px;line-height:20px;font-weight:650;letter-spacing:2px;color:#2b5886;">伴学爪</p>
              <img src="cid:paw-mascot" alt="向你招手的爪爪" width="108" height="98" style="display:block;margin:0 auto;border:4px solid #fff;border-radius:28px;background-color:#fff9ec;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:29px 24px 28px;">
              <h1 style="margin:0 0 8px;font-size:25px;line-height:1.35;letter-spacing:-.4px;color:#17283d;">{{heading}}</h1>
              <p style="margin:0;font-size:14px;line-height:1.7;color:#4f647a;">{{instruction}}</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:280px;margin:22px auto 0;background-color:#edf6ff;border:1px solid #cfe4fa;border-radius:16px;">
                <tr>
                  <td align="center" style="padding:14px 2px 16px;">
                    <p style="margin:0 0 3px;color:#38618c;font-size:11px;line-height:18px;font-weight:650;letter-spacing:2px;">邮箱验证码</p>
                    <p style="margin:0;text-indent:6px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-variant-numeric:tabular-nums;font-size:34px;line-height:42px;font-weight:750;letter-spacing:6px;color:#124578;user-select:all;">{{code}}</p>
                  </td>
                </tr>
              </table>
              <p style="margin:15px 0 0;color:#4f647a;font-size:12px;line-height:19px;">{{expiry_minutes}} 分钟内有效，请勿转发验证码。</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="border-top:1px solid #e6eff8;background-color:#f8fbff;padding:14px 18px;color:#53697f;font-size:12px;line-height:20px;">
              如果这不是您的操作，可以忽略此邮件。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
